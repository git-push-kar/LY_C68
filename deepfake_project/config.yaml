dataset_root: "C:/Users/Admin/Desktop/ly project c 68/deepfake_project/datasets/hydrafake"
json_root: "C:/Users/Admin/Desktop/ly project c 68/deepfake_project/datasets/hydrafake/jsons"
model_path: "./models/InternVL3-2B"
tokenizer_path: "./models/InternVL3-2B"
output_dir: "./runs/intern_exp3_corrective"
resume: "./runs/intern_exp3_corrective/checkpoints/ep001.pth"
epochs_cls: 0
epochs_joint: 2
lm_seq_len: 512
lr: 5.0e-06
weight_decay: 0.01
lora_rank: 64
lora_alpha: 128
lm_loss_weight: 0.3
batch_size: 4
grad_accum: 8
num_workers: 8
warmup_ratio: 0.05
patience: 5
freeze_cls_head: false
freeze_projector: false
image_size: 448
max_new_tokens: 512
checkpoint: "./runs/intern_exp3_corrective/checkpoints/best.pth"

# ── Eval defaults ───────────────────────────────────────────────────────
# eval shares dataset_root/json_root/model_path above
eval_batch_size: 8
eval_num_workers: 8

# ── Inference defaults ──────────────────────────────────────────────────
# inference shares model_path/checkpoint/image_size above
# images are relative to project root (test_images/ contains 1.jpg etc.)
inference_images:
  - "test_images/1.jpg"
  - "test_images/2.jpg"
  - "test_images/3.jpg"
  - "test_images/4.jpg"
