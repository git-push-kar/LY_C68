# config.yaml
# ============
# Central configuration for DeepfakeReasoningModel v2 (InternVL3-2B).
# Priority: CLI arguments ALWAYS override config file values.

# ── Active Run Configuration: DeepfakeReasoningModel v2 Full Curriculum ──
# dataset_root: "C:/path/to/hydrafake"
# json_root: "C:/path/to/hydrafake/jsons"
model_path: "./models/InternVL3-2B"
tokenizer_path: "./models/InternVL3-2B"
output_dir: "./runs/intern_v2"
arch_version: "v2"

# ── Architecture Hyperparameters ──────────────────────────────────────────
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

vision_lora_rank: 16
vision_lora_alpha: 32
vision_lora_dropout: 0.05

# ── Training & Optimization ───────────────────────────────────────────────
# RTX A5000 (24GB VRAM) recommended: batch_size=4, grad_accum=8 (effective batch=32)
batch_size: 4
grad_accum: 8
epochs_cls: 3
epochs_joint: 2
lr: 5.0e-05
weight_decay: 0.01
warmup_ratio: 0.05
patience: 5
num_workers: 8
attn_implementation: "sdpa"
use_gradient_checkpointing: true

# ── Loss Weights & Curriculum ─────────────────────────────────────────────
# Linear ramp across joint epochs: start at 0.3 -> end at 0.6
lm_loss_weight_start: 0.3
lm_loss_weight_end: 0.6
consistency_loss_weight: 0.05

# ── Sequence & Image Dimensions ───────────────────────────────────────────
image_size: 448
lm_seq_len: 512
max_new_tokens: 512

# ── Evaluation & Inference Defaults ───────────────────────────────────────
eval_batch_size: 8
eval_num_workers: 8

inference_images:
  - "test_images/1.jpg"
  - "test_images/2.jpg"
  - "test_images/3.jpg"
  - "test_images/4.jpg"
