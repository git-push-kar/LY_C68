# config.yaml
# ============
# Central configuration for DeepfakeReasoningModel v2 (InternVL3-2B).
# Priority: CLI arguments ALWAYS override config file values.

# ── Active Run Configuration: DeepfakeReasoningModel v2 Full Curriculum ──
# Resolved against this repo: deepfake_project/datasets/hydrafake/
# (relative => portable across Windows dev box and Linux RTX A5000 box;
#  CLI --dataset_root / --json_root still override these values)
dataset_root: "./datasets/hydrafake"
json_root: "./datasets/hydrafake/jsons"
model_path: "./models/InternVL3-2B"
tokenizer_path: "./models/InternVL3-2B"
output_dir: "./runs/intern_v2"
arch_version: "v2"

# ── Architecture Hyperparameters ──────────────────────────────────────────
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

vision_lora_rank: 16
vision_lora_alpha: 32
vision_lora_dropout: 0.05

# ── Training & Optimization ───────────────────────────────────────────────
# RTX A5000 (24GB VRAM) recommended: batch_size=4, grad_accum=8 (effective batch=32)
batch_size: 4
grad_accum: 8
epochs_cls: 3
epochs_joint: 10
lr: 5.0e-05
weight_decay: 0.01
warmup_ratio: 0.05
patience: 5
num_workers: 8
attn_implementation: "sdpa"
use_gradient_checkpointing: true

# ── Loss Weights & Curriculum ─────────────────────────────────────────────
# Linear ramp across joint epochs: start at 0.3 -> end at 0.6
lm_loss_weight_start: 0.3
lm_loss_weight_end: 0.6
consistency_loss_weight: 0.05

# ── Sequence & Image Dimensions ───────────────────────────────────────────
image_size: 448
lm_seq_len: 512
max_new_tokens: 512

# ── Evaluation & Inference Defaults ───────────────────────────────────────
eval_batch_size: 8
eval_num_workers: 8
eval_threshold: 0.5
checkpoint: "./runs/intern_v2/checkpoints/best.pth"

# ── Stage 3: DPO Preference Optimization Defaults ────────────────────────
dpo_output_dir: "./runs/intern_v2_dpo"
dpo_epochs: 2
dpo_lr: 1.0e-06
dpo_beta: 0.1
dpo_batch_size: 4
dpo_grad_accum: 8

inference_images:
  - "test_images/1.jpg"
  - "test_images/2.jpg"
  - "test_images/3.jpg"
  - "test_images/4.jpg"

