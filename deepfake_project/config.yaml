# config.yaml
# ============
# Central configuration for DeepfakeReasoningModel v2 (InternVL3-2B).
# Priority: CLI arguments ALWAYS override config file values.

# ── Active Run Configuration: DeepfakeReasoningModel v2 Full Curriculum ──
# Base: upstream vanilla InternVL3-2B (Lineage B). The deployed model is the
# grounded vanilla checkpoint runs/intern_v2_ground/checkpoints/best.pth
# (epoch 3, best_auc 0.990270). Lineage A (internvl3_2b_lr_fused) is retained for
# comparison; see RESEARCH_PAPER_REPORT.md §3.7.
# Resolved against this repo: deepfake_project/datasets/hydrafake/
# (relative => portable across Windows dev box and Linux RTX A5000 box;
#  CLI --dataset_root / --json_root still override these values)
dataset_root: "./datasets/hydrafake"
json_root: "./datasets/hydrafake/jsons"
model_path: "./models/InternVL3-2B"
tokenizer_path: "./models/InternVL3-2B"
output_dir: "./runs/intern_v2_ground"
arch_version: "v2"

# ── Architecture Hyperparameters ──────────────────────────────────────────
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

vision_lora_rank: 16
vision_lora_alpha: 32
vision_lora_dropout: 0.05

# ── Training & Optimization ───────────────────────────────────────────────
# RTX A5000 (24GB VRAM) recommended: batch_size=4, grad_accum=8 (effective batch=32)
batch_size: 4
grad_accum: 8
epochs_cls: 3
epochs_joint: 3
lr: 5.0e-05
weight_decay: 0.01
warmup_ratio: 0.05
patience: 5
num_workers: 8
attn_implementation: "sdpa"
use_gradient_checkpointing: true

# ── Loss Weights & Curriculum ─────────────────────────────────────────────
# Linear ramp across joint epochs: start at 0.3 -> end at 0.6
lm_loss_weight_start: 0.3
lm_loss_weight_end: 0.6
consistency_loss_weight: 0.05

# ── Sequence & Image Dimensions ───────────────────────────────────────────
image_size: 448
lm_seq_len: 512
max_new_tokens: 512

# ── Evaluation & Inference Defaults ───────────────────────────────────────
eval_batch_size: 8
eval_num_workers: 8
eval_threshold: 0.5
checkpoint: "./runs/intern_v2_ground/checkpoints/best.pth"

# ── Stage 3: DPO Preference Optimization Defaults ────────────────────────
dpo_output_dir: "./runs/intern_fused_dpo"
dpo_epochs: 2
dpo_lr: 1.0e-06
dpo_beta: 0.1
dpo_batch_size: 4
dpo_grad_accum: 8

# ── Benchmark Evaluation Metrics (Post-Epoch 6 on NVIDIA RTX A5000) ──────────
# Evaluated on 52,266 test samples (eval_best.log)
benchmark_metrics:
  id_in_domain:
    samples: 12819
    accuracy: 0.9201
    f1: 0.9217
    auc: 0.9823
    optimal_threshold: 0.50
  cm_cross_model:
    samples: 11249
    accuracy: 0.9916
    f1: 0.9915
    auc: 0.9995
    optimal_threshold: 0.50
  cf_cross_forgery:
    samples: 12730
    accuracy: 0.8093
    f1: 0.7669
    auc: 0.9418
    optimal_threshold: 0.42
    calibrated_accuracy: 0.8740
    calibrated_f1: 0.8650
  cd_cross_domain:
    samples: 15468
    accuracy: 0.7785
    f1: 0.7641
    auc: 0.8680
    optimal_threshold: 0.44
    calibrated_accuracy: 0.8120
    calibrated_f1: 0.8010
  mean:
    samples: 52266
    accuracy: 0.8749
    f1: 0.8611
    auc: 0.9479
    calibrated_accuracy: 0.8994
    calibrated_f1: 0.8948

inference_images:
  - "test_images/1.jpg"
  - "test_images/2.jpg"
  - "test_images/3.jpg"
  - "test_images/4.jpg"


# ── Multi-face pipeline (inference_faces.py, INTEGRATION_GUIDE section 11) ──
# These are the measured defaults, not tunables for training: see
# FACE_PIPELINE_CALIBRATION.md for the sweeps behind margin, face_threshold and
# passthrough_min_face_frac. inference_faces.py carries the same numbers as its
# CLI defaults; loaders skip nested blocks, so this is a single reference copy.
face_pipeline:
  detector_weights: "./models/yolov8n-face.pt"   # SHA-256 pinned, fetched by fetch_detector_weights.py
  detector_conf: 0.25
  detector_imgsz: 640
  max_detect_pixels: 4096                        # downscale huge inputs before detection
  min_face_px: 96                               # shorter box side, original pixels
  max_faces: 8
  margin: 0.30                                  # background ring around each face
  passthrough_min_face_frac: 0.05               # lone-face area floor for the whole-image path
  face_threshold: 0.50                          # p_fake decision boundary
  aggregate: "max"
  reason_faces: "top1"                          # none | top1 | all
  save_crops: null
  save_annotated: null


